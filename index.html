<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邬宇鑫 | 用AI做产品的内容策划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-image: linear-gradient(90deg, #3B82F6, #8B5CF6);
            }
            .bg-gradient {
                background-image: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
            }
            .glass {
                backdrop-filter: blur(10px);
                background-color: rgba(255, 255, 255, 0.7);
            }
        }
    </style>
</head>
<body class="bg-gradient min-h-screen text-dark">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 头部信息区 -->
        <header class="glass rounded-2xl p-6 md:p-8 shadow-lg mb-8 transform transition-all hover:shadow-xl">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <!-- 头像 -->
                <div class="w-32 h-32 rounded-full bg-gradient p-1 shadow-md">
                    <div class="w-full h-full rounded-full bg-white flex items-center justify-center text-4xl font-bold text-gradient">
                        邬
                    </div>
                </div>
                
                <!-- 基本介绍 -->
                <div class="text-center md:text-left">
                    <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold mb-2">邬宇鑫</h1>
                    <p class="text-xl text-gradient font-medium mb-4">一个正在学习用 AI 做产品的内容策划</p>
                    <div class="flex flex-wrap justify-center md:justify-start gap-2 mt-2">
                        <span class="px-3 py-1 rounded-full bg-primary/10 text-primary text-sm">AI应用</span>
                        <span class="px-3 py-1 rounded-full bg-secondary/10 text-secondary text-sm">内容策划</span>
                        <span class="px-3 py-1 rounded-full bg-primary/10 text-primary text-sm">知识整理</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- 个人信息区 -->
        <section class="glass rounded-2xl p-6 md:p-8 shadow-lg mb-8">
            <h2 class="text-xl font-bold mb-4 flex items-center">
                <i class="fa fa-user-circle-o mr-2 text-primary"></i> 关于我
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-3">
                    <p><span class="font-medium text-primary">当前在做：</span>整理自己的作品和写作方向，搭建个人主页</p>
                    <p><span class="font-medium text-secondary">兴趣爱好：</span>AI 应用探索、打乒乓球、爬山、健身</p>
                </div>
                <div class="space-y-3">
                    <p><span class="font-medium text-primary">核心特点：</span>喜欢把复杂问题讲成人话</p>
                    <p><span class="font-medium text-secondary">擅长方向：</span>内容表达、知识体系梳理、AI产品落地</p>
                </div>
            </div>
        </section>

        <!-- 数字分身聊天区 -->
        <section class="glass rounded-2xl p-6 md:p-8 shadow-lg">
            <h2 class="text-xl font-bold mb-4 flex items-center">
                <i class="fa fa-comments-o mr-2 text-secondary"></i> 我的数字分身
            </h2>
            
            <!-- 聊天窗口 -->
            <div id="chat-container" class="bg-white/60 rounded-xl p-4 h-[400px] overflow-y-auto mb-4 space-y-4">
                <div class="flex gap-3 items-start">
                    <div class="w-8 h-8 rounded-full bg-gradient flex-shrink-0 flex items-center justify-center text-white text-sm">
                        宇
                    </div>
                    <div class="bg-white rounded-xl p-3 max-w-[80%] shadow-sm">
                        你好呀，我是邬宇鑫的数字分身😉 你可以问我关于他的工作、作品和合作相关的问题，我会把复杂的信息给你讲得明明白白~
                    </div>
                </div>
            </div>
            
            <!-- 快捷问题按钮 -->
            <div class="flex flex-wrap gap-2 mb-4">
                <button class="quick-question px-3 py-2 rounded-lg bg-primary/10 hover:bg-primary/20 text-primary text-sm transition-all">
                    你现在在做什么？
                </button>
                <button class="quick-question px-3 py-2 rounded-lg bg-secondary/10 hover:bg-secondary/20 text-secondary text-sm transition-all">
                    你有哪些作品？
                </button>
                <button class="quick-question px-3 py-2 rounded-lg bg-primary/10 hover:bg-primary/20 text-primary text-sm transition-all">
                    怎么联系你？
                </button>
            </div>
            
            <!-- 输入区 -->
            <form id="chat-form" class="flex gap-2">
                <input id="user-input" type="text" placeholder="输入你的问题..." 
                    class="flex-1 px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50">
                <button type="submit" class="bg-gradient hover:opacity-90 text-white px-5 py-3 rounded-xl font-medium transition-all">
                    <i class="fa fa-paper-plane"></i>
                </button>
            </form>
        </section>

        <!-- 页脚 -->
        <footer class="text-center mt-8 text-white/80 text-sm">
            <p>© 2026 邬宇鑫 | 把复杂问题讲成人话</p>
        </footer>
    </div>

    <script>
        // 数字分身知识库
        const knowledgeBase = {
            "你现在在做什么？": "我最近正在搭建自己的个人主页，同时在系统整理过往的作品集和写作方向，主要聚焦AI应用和内容产品相关的探索，后续也会把更多实战项目经验分享出来。",
            "你有哪些作品？": "我目前的作品主要分为内容策划和AI应用两个方向：包括多份AI产品落地的策划方案、知识体系梳理类的专栏文章，以及多个用AI搭建的效率工具原型，后续都会在这个个人主页里完整展示出来。",
            "怎么联系你？": "你可以直接通过这个页面的聊天框给我留言，也可以通过主流社交平台搜索「邬宇鑫」找到我，有合作想法或者行业交流都欢迎随时打招呼~",
            "default": "这是一个很好的问题，目前我的主站还在持续完善中，关于我的更多详细信息你可以后面再来查看，也可以点击上方的三个快捷问题了解核心信息~"
        }

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const quickQuestions = document.querySelectorAll('.quick-question');

        // 添加消息函数
        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex gap-3 items-start ${isUser ? 'flex-row-reverse' : ''}`;
            
            if (isUser) {
                messageDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-dark flex-shrink-0 flex items-center justify-center text-white text-sm">你</div>
                    <div class="bg-primary text-white rounded-xl p-3 max-w-[80%] shadow-sm">${content}</div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient flex-shrink-0 flex items-center justify-center text-white text-sm">宇</div>
                    <div class="bg-white rounded-xl p-3 max-w-[80%] shadow-sm">${content}</div>
                `;
            }

            chatContainer.appendChild(messageDiv);
            // 自动滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 处理提问
        function handleQuestion(question) {
            if (!question.trim()) return;
            addMessage(question, true);
            
            // 模拟回复延迟
            setTimeout(() => {
                const answer = knowledgeBase[question] || knowledgeBase['default'];
                addMessage(answer);
            }, 600);
            
            userInput.value = '';
        }

        // 表单提交事件
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            handleQuestion(userInput.value);
        });

        // 快捷按钮点击事件
        quickQuestions.forEach(btn => {
            btn.addEventListener('click', () => {
                handleQuestion(btn.textContent.trim());
            });
        });
    </script>
</body>
</html>
